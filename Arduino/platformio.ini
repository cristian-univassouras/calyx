[platformio]
src_dir = .

[common]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    RoboCore/RoboCore - SMW_SX1276M0@^1.1.0

[env:node1]
extends = common
upload_port = COM4
monitor_port = COM4
build_src_filter = -<*> +<src_node/>
build_flags = -DNODE_ID=1

[env:node2]
extends = common
upload_port = COM4
monitor_port = COM4
build_src_filter = -<*> +<src_node/>
build_flags = -DNODE_ID=2

[env:gateway]
extends = common
upload_port = COM6
monitor_port = COM6
build_src_filter = -<*> +<src_gateway/>
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5

[env:test_tx]
extends = common
upload_port = COM4
monitor_port = COM4
build_src_filter = -<*> +<test_p2p_tx/>

[env:test_rx]
extends = common
upload_port = COM6
monitor_port = COM6
build_src_filter = -<*> +<test_p2p_rx/>

[env:esp32dev]
extends = common
upload_port = COM8
monitor_port = COM8
build_src_filter = -<*> +<src/>
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
